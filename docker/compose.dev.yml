# Local development services. Start with `pnpm dev:up` (it passes the repo-root .env).
# Every published port is bound to 127.0.0.1 only. Images are pinned by digest.
# MinIO comes from Chainguard because MinIO stopped publishing free images (ADR 0004).
name: dms

x-minio-image: &minio-image cgr.dev/chainguard/minio:latest@sha256:b9b1cce81a4a6cc9bf250e68d621cc0b9fb8ed15aefe18fcd1840525eab6a81a

services:
  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh first}
      DMS_OWNER_PASSWORD: ${DMS_OWNER_PASSWORD:?run scripts/setup.sh first}
      DMS_APP_PASSWORD: ${DMS_APP_PASSWORD:?run scripts/setup.sh first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dms"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/setup.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/setup.sh first}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: *minio-image
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      S3_BUCKET: ${S3_BUCKET:?run scripts/setup.sh first}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/setup.sh first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/setup.sh first}
    volumes:
      - ./minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    profiles: ["init"]

volumes:
  pgdata:
  miniodata:
