name: CLA

# CLA Assistant Lite. Signatures are stored in the `cla-signatures` branch.
# pull_request_target is required so the bot can comment on PRs from forks. This workflow never
# checks out or runs code from the pull request.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    # contents: write lets the bot push to the cla-signatures branch; main is protected by
    # branch protection, so it cannot be pushed to.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Gurkirat-Khaira,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
